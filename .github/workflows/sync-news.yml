name: Publish news
on:
  issues:
    types: [opened, edited, reopened, closed, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  issues: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check published issues
        run: node tools/sync-news.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update the static news feed
        run: |
          if git diff --quiet -- news/posts.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/posts.json
          git commit -m 'Update published news'
          git push
