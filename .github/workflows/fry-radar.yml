name: Update Fry Radar

on:
  schedule:
    # Run once per day at 09:17 KST (00:17 UTC).
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fry-radar-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check whether collection is due
        id: due
        env:
          RADAR_SCHEDULE: ${{ github.event.schedule }}
        run: node tools/fry-radar-schedule.mjs >> "$GITHUB_OUTPUT"
      - name: Test Fry Radar parsing and date rules
        if: steps.due.outputs.run == 'true'
        run: node --test tools/test-fry-radar.mjs
      - name: Test deletion authorization
        if: steps.due.outputs.run == 'true'
        run: node --test tools/test-fry-delete.mjs
      - name: Collect verified fry news
        if: steps.due.outputs.run == 'true'
        run: |
          node tools/collect-fry-radar.mjs || { sleep 5; node tools/collect-fry-radar.mjs; }
      - name: Collect official brand promotions and preview images
        if: steps.due.outputs.run == 'true'
        run: |
          node tools/collect-official-fry-radar.mjs || { sleep 5; node tools/collect-official-fry-radar.mjs; }
      - name: Refresh authenticated deletion choices
        if: steps.due.outputs.run == 'true'
        run: node tools/sync-fry-delete-template.mjs
      - name: Check site
        if: steps.due.outputs.run == 'true'
        run: node tools/check-site.mjs
      - name: Publish updated data
        if: steps.due.outputs.run == 'true'
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- data/fry-radar.json data/fry-radar-health.json .github/ISSUE_TEMPLATE/fry-delete.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fry-radar.json data/fry-radar-health.json .github/ISSUE_TEMPLATE/fry-delete.yml
          git commit -m "Update Fry Radar news and collection health"
          # Rebase on fresh main if another edit was made during collection.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "ERROR: Rebase conflict; preserving remote data instead of overwriting it."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "ERROR: Failed to publish after 3 attempts."
          exit 1
      # GITHUB_TOKEN commits do not trigger Pages builds automatically.
      - name: Rebuild GitHub Pages after data change
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh api --method POST "repos/${{ github.repository }}/pages/builds"; then
              echo "GitHub Pages rebuild requested"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "ERROR: Could not request GitHub Pages rebuild."
          exit 1

      - name: Preserve collection diagnostics
        if: always() && steps.due.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fry-radar-diagnostics-${{ github.run_id }}
          path: data/fry-radar-health.json
          retention-days: 14
