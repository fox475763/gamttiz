name: Update Fry Radar

on:
  push:
    branches: [main]
    paths:
      - 'tools/collect-fry-radar.mjs'
      - 'tools/collect-official-fry-radar.mjs'
      - '.github/workflows/fry-radar.yml'
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC is 09:00 in Korea.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: fry-radar-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect verified fry news
        run: node tools/collect-fry-radar.mjs
      - name: Collect official brand promotions and preview images
        run: node tools/collect-official-fry-radar.mjs
      - name: Check site
        run: node tools/check-site.mjs
      - name: Publish updated data
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- data/fry-radar.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fry-radar.json
          git commit -m "Update Fry Radar news"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

