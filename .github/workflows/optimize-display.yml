name: Optimize display images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'tools/optimize-display-images.py'
      - 'index.html'
      - 'products.html'
      - 'project.html'
      - 'play.html'
      - 'combo.html'
permissions:
  contents: write
  pages: write
concurrency:
  group: gamttiz-display-images
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python tools/optimize-display-images.py
      - run: node tools/check-site.mjs
      - name: Publish optimized display assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gamttiz-image-bot"
          git config user.email "gamttiz-image-bot@users.noreply.github.com"
          git add -- assets/display display-assets.js index.html products.html project.html play.html combo.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize display image variants"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST repos/${{ github.repository }}/pages/builds
