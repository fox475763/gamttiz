name: 감띠즈 소식
description: 감띠즈 홈페이지에 소식을 올립니다
title: "[NEWS] "
body:
  - type: input
    id: author
    attributes:
      label: 게시자 이름
      value: 채민석
    validations:
      required: true
  - type: input
    id: excerpt
    attributes:
      label: 짧은 소개
      description: 홈페이지와 소식 목록에 표시됩니다.
    validations:
      required: false
  - type: textarea
    id: body
    attributes:
      label: 본문
      description: 소식 내용을 입력해 주세요.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 사진과 파일
      description: 사진이나 파일을 이 칸에 끌어다 놓아 첨부하세요.
    validations:
      required: false
