<!doctype html><html lang="ko"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="assets/badge.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="refinement.css"><link rel="stylesheet" href="site-font.css"><link rel="stylesheet" href="studio-polish.css"><link rel="stylesheet" href="catalog-news.css">

</head><body><main class="admin-page"><a href="news.html" class="news-back">← 소식 페이지</a><p class="eyebrow">GAMTTIZ / OWNER EDITOR</p><h1>새 소식 올리기</h1><p>글과 사진을 저장소에 올리면 GitHub Pages가 새 버전을 게시합니다. 저장소에 쓰기 권한이 있는 계정의 토큰이 필요합니다. 토큰은 이 페이지에 저장되지 않습니다.</p>
  <form id="news-form"><div class="admin-row"><label>GitHub 사용자명<input id="repo-owner" value="fox475763" autocomplete="off" required></label><label>저장소 이름<input id="repo-name" value="gamttiz" autocomplete="off" required></label></div><label>GitHub 접근 토큰<input id="github-token" type="password" autocomplete="off" spellcheck="false" required><small>Fine-grained token의 해당 저장소 Contents: Read and write 권한을 사용하세요. 입력한 토큰은 브라우저 메모리에서만 사용하며 저장하지 않습니다.</small></label><label>제목<input id="post-title" maxlength="100" required></label><label>짧은 소개<input id="post-excerpt" maxlength="180" required></label><label>본문<textarea id="post-body" rows="9" required></textarea></label><label>사진 (선택, 최대 6장)<input id="post-images" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label><button type="submit" id="publish-button">소식 게시하기 ↗</button><p id="admin-status" role="status" aria-live="polite"></p></form>
  <p class="admin-help">이 편집기는 GitHub에 직접 업로드합니다. 사용자에게는 <a href="news.html">소식 페이지</a>만 공유하세요. 저장소 공개 여부와 관계없이, 게시 권한은 토큰의 권한으로 확인됩니다.</p></main></body></html>
